<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ear Acoustics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a figure-style 3D stage on the left with colour bar and readouts; a control rail on the right.
   One light look on purpose: it reads as a journal figure, not a product screen. */
:root {
  --page: #f2f1ee; --stage: #fbfaf8; --panel: #ffffff; --line: #dcd9d3; --fg: #1c2127; --muted: #5d646e;
  --accent: #2f5fd0; --accent-ink: #ffffff;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--page); color: var(--fg); font: 14px/1.5 var(--body); }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%; }
.stage { position: relative; background: var(--stage); min-height: 460px; border-right: 1px solid var(--line); }
#gl { width: 100%; height: 100%; display: block; touch-action: none; }
.hud { position: absolute; left: 16px; top: 14px; right: 190px; display: flex; flex-direction: column; gap: 2px; pointer-events: none; }
.hud b { font-size: 15px; font-weight: 600; } .hud span { color: var(--muted); font: 12px var(--mono); font-variant-numeric: tabular-nums; }
.views { position: absolute; right: 14px; top: 12px; display: flex; gap: 4px; }
.views button { font: 500 12px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; cursor: pointer; }
.views button:hover { border-color: var(--muted); }
.cbar { position: absolute; left: 16px; bottom: 14px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 6px; display: flex; flex-direction: column; gap: 4px; }
.cbar b { font-size: 12px; font-weight: 600; }
#cbar { width: 260px; height: 38px; display: block; }
.rail { background: var(--panel); overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 16px; font-weight: 600; }
h2 { margin: 0; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
section { display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { font: 500 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .4; cursor: not-allowed; }
.explain { margin: 0; font-size: 13px; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 14px; cursor: pointer; flex: none; }
input[type="range"] { flex: 1; accent-color: var(--accent); }
.time { font: 12px var(--mono); color: var(--muted); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.toggles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.toggles label { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.toggles input { accent-color: var(--accent); width: 15px; height: 15px; }
.audio { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.audio button { font: 500 13px var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; min-height: 40px; text-align: left; }
.audio button.on { border-color: var(--accent); color: var(--accent); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.note ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 13px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
svg text { font-family: var(--body); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 860px) { .app { grid-template-columns: 1fr; grid-template-rows: 62vh auto; height: auto; } .stage { border-right: 0; border-bottom: 1px solid var(--line); } #cbar { width: 200px; } .hud { right: 16px; top: 52px; } }
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="gl" aria-label="3D view of the sound field around the ear"></canvas>
    <div class="hud"><b id="title">Loading…</b><span id="sub"></span></div>
    <div class="views" role="group" aria-label="Camera">
      <button type="button" data-view="3d">3D</button>
      <button type="button" data-view="top">Top</button>
      <button type="button" data-view="front">Front</button>
    </div>
    <div class="cbar"><b id="cbarLabel"></b><canvas id="cbar" width="520" height="76" aria-hidden="true"></canvas></div>
  </div>
  <aside class="rail">
    <section>
      <h1>Sound around your ear</h1>
      <p class="explain" id="explain"></p>
    </section>
    <section>
      <h2>Speaker position</h2>
      <div class="seg" id="dirs" role="group" aria-label="Speaker position"></div>
    </section>
    <section>
      <h2>Sound</h2>
      <div class="seg" id="sound" role="group" aria-label="Sound"></div>
    </section>
    <section>
      <h2>Show</h2>
      <div class="seg" id="disp" role="group" aria-label="Display">
        <button type="button" data-disp="3d" aria-pressed="true">3D wavefronts</button>
        <button type="button" data-disp="slices" aria-pressed="false">Slices</button>
      </div>
      <div class="seg" id="mode" role="group" aria-label="Quantity">
        <button type="button" data-mode="0" aria-pressed="true">Pressure</button>
        <button type="button" data-mode="1" aria-pressed="false" id="splBtn">Sound level (dB)</button>
      </div>
      <div class="row">
        <button class="play" id="play" type="button" aria-label="Pause">❚❚</button>
        <input type="range" id="scrub" min="0" max="359" value="0" aria-label="Time">
        <span class="time" id="time"></span>
      </div>
      <div class="row" id="isoRow">
        <label for="iso" class="explain" style="white-space:nowrap">Surface at ±</label>
        <input type="range" id="iso" min="0.1" max="1.5" step="0.05" value="0.5">
        <span class="time" id="isoOut"></span>
      </div>
      <div class="toggles">
        <label><input type="checkbox" id="tH" checked> Horizontal slice</label>
        <label><input type="checkbox" id="tV"> Vertical slice</label>
        <label><input type="checkbox" id="tS"> Colour the ear by sound</label>
        <label><input type="checkbox" id="tL" checked> Energy flow lines</label>
        <label><input type="checkbox" id="tB" checked> Head wall</label>
        <label><input type="checkbox" id="tE"> See-through ear</label>
        <label><input type="checkbox" id="tX"> Cutaway</label>
        <label><input type="checkbox" id="tN"> Negative surfaces</label>
      </div>
    </section>
    <section>
      <h2>At this ear</h2>
      <dl class="kv" id="facts"></dl>
      <svg id="chart" viewBox="0 0 320 180" width="100%" role="img" aria-label="Gain at the canal entrance and eardrum versus frequency"></svg>
      <p class="note">Gain compared with the same speaker in open air, from the click simulation. Dashed lines mark the steady tones.</p>
    </section>
    <section>
      <h2>Listen</h2>
      <div class="audio">
        <button type="button" id="aFree">Speaker in open air</button>
        <button type="button" id="aEar">At the eardrum, this position</button>
      </div>
      <audio id="player" preload="none"></audio>
    </section>
    <section>
      <h2>Model</h2>
      <div class="note" id="assume"></div>
    </section>
  </aside>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const $ = (id) => document.getElementById(id);
const CLIP = 2.0;                       // colour range: ±2 × the incoming wave
const DB = [-20, 20];                   // level range, dB re the incoming wave
const [ear, runs] = await Promise.all([fetch('ear.json').then((r) => r.json()), fetch('runs.json').then((r) => r.json())]);

// ---------- colour scales: ColorBrewer RdBu (diverging) and viridis (sequential) ----------
const RDBU = ['#053061', '#2166ac', '#4393c3', '#92c5de', '#d1e5f0', '#f7f7f7', '#fddbc7', '#f4a582', '#d6604d', '#b2182b', '#67001f'];
const VIRIDIS = ['#440154', '#482878', '#3e4989', '#31688e', '#26828e', '#1f9e89', '#35b779', '#6ece58', '#b5de2b', '#fde725'];
function lut(stops) {
  const cs = stops.map((h) => new THREE.Color(h)), out = new Uint8Array(256 * 4);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (cs.length - 1), j = Math.min(cs.length - 2, Math.floor(t)), c = cs[j].clone().lerp(cs[j + 1], t - j);
    out.set([c.r * 255, c.g * 255, c.b * 255, 255], i * 4);
  }
  return out;
}
const LUTS = [lut(RDBU), lut(VIRIDIS)];
const lutTex = LUTS.map((d) => { const t = new THREE.DataTexture(d, 256, 1); t.magFilter = t.minFilter = THREE.LinearFilter; t.needsUpdate = true; return t; });
const sample = (k, t) => { const i = Math.round(Math.min(1, Math.max(0, t)) * 255) * 4, d = LUTS[k]; return [d[i] / 255, d[i + 1] / 255, d[i + 2] / 255]; };

// ---------- scene ----------
const canvas = $('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xfbfaf8);
renderer.localClippingEnabled = true;
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);   // set per view: keeps the ear BEHIND the slice
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 1, 5000);
const controls = new OrbitControls(camera, canvas); controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 1.7));
const key = new THREE.DirectionalLight(0xffffff, 1.1); key.position.set(150, 220, 120); scene.add(key);

// The ear is drawn as the "skin" (backend ear_world.skin: smoothed, photo colours). Sound results live on the
// solver's ORIGINAL vertices; each skin vertex averages its two parents. Older runs have no skin: use the mesh.
const SK = ear.skin || { verts: ear.ear.verts, faces: ear.ear.faces, rgb: null,
  parents: Array.from({ length: ear.ear.verts.length / 3 }, (_, i) => [i, i]).flat() };
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.Float32BufferAttribute(SK.verts, 3));
geo.setIndex(SK.faces); geo.computeVertexNormals();
const nV = ear.ear.verts.length / 3, nS = SK.verts.length / 3, vcol = new Float32Array(nS * 3);
// photo colours are sRGB bytes; three.js shades in linear light
const skinCol = new Float32Array(nS * 3).map((_, k) => SK.rgb ? new THREE.Color().setRGB(SK.rgb[k - k % 3] / 255, SK.rgb[k - k % 3 + 1] / 255, SK.rgb[k - k % 3 + 2] / 255, THREE.SRGBColorSpace).toArray()[k % 3] : [0.69, 0.66, 0.6][k % 3]);
vcol.set(skinCol);
geo.setAttribute('color', new THREE.BufferAttribute(vcol, 3));
const earMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .6, metalness: 0, side: THREE.DoubleSide,
  polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1 });   // offset: the mesh lines must win the depth test
const edgeMat = new THREE.LineBasicMaterial({ color: 0x4a3a30, transparent: true, opacity: .45 });
const earMesh = new THREE.Mesh(geo, earMat); scene.add(earMesh);
scene.add(new THREE.LineSegments(new THREE.WireframeGeometry(geo), edgeMat));

const cp = new THREE.Vector3(...ear.canal.point), ca = new THREE.Vector3(...ear.canal.axis);
const R = ear.canal.diameter_mm / 2, Lc = ear.canal.length_mm;
const canal = new THREE.Group();
const tube = new THREE.Mesh(new THREE.CylinderGeometry(R, R, Lc, 40, 1, true), new THREE.MeshStandardMaterial({ color: 0xb9b3aa, transparent: true, opacity: .35, side: THREE.DoubleSide, depthWrite: false }));
tube.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), ca); tube.position.copy(cp).addScaledVector(ca, Lc / 2); canal.add(tube);
for (const t of [0, Lc]) {
  const pts = []; for (let i = 0; i < 48; i++) { const a = i / 48 * 2 * Math.PI; pts.push(new THREE.Vector3(Math.cos(a) * R, Math.sin(a) * R, 0)); }
  const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0x3b4048 }));
  ring.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), ca); ring.position.copy(cp).addScaledVector(ca, t); canal.add(ring);
}
const drum = new THREE.Mesh(new THREE.CircleGeometry(R, 40), new THREE.MeshStandardMaterial({ color: 0x8a5a44, side: THREE.DoubleSide }));
drum.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), ca); drum.position.copy(cp).addScaledVector(ca, Lc); canal.add(drum);
scene.add(canal);

function label(text, size = 4.2, color = '#1c2127') {
  const c = document.createElement('canvas'), g = c.getContext('2d'), px = 48;
  g.font = `500 ${px}px Inter, system-ui, sans-serif`;
  c.width = Math.ceil(g.measureText(text).width) + 16; c.height = px + 16;
  g.font = `500 ${px}px Inter, system-ui, sans-serif`; g.fillStyle = color; g.textBaseline = 'middle'; g.fillText(text, 8, c.height / 2);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false, transparent: true }));
  s.scale.set(size * c.width / c.height, size, 1); s.renderOrder = 20; return s;
}
const drumLabel = label('eardrum', 3.4, '#5d646e'); drumLabel.position.copy(cp).addScaledVector(ca, Lc + 6); scene.add(drumLabel);

// slice planes, coloured by a shader so phase, mode and contours update without rebuilding textures
const VS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const FS = `
uniform sampler2D field; uniform sampler2D mask; uniform sampler2D lutDiv; uniform sampler2D lutSeq;
uniform float phase; uniform int mode; uniform float clipv; uniform float opacity; uniform float lines;
varying vec2 vUv;
void main(){
  if (texture2D(mask, vUv).r > 0.5) { gl_FragColor = vec4(0.788, 0.769, 0.737, opacity); return; }   // cut tissue
  vec2 a = texture2D(field, vUv).rg;
  vec3 col; float v; float stepv;
  if (mode == 0) {
    v = a.x * cos(phase) - a.y * sin(phase);
    col = texture2D(lutDiv, vec2(clamp(v / clipv * 0.5 + 0.5, 0.0, 1.0), 0.5)).rgb;
    stepv = abs(v) > clipv ? 0.0 : 0.5;                   // isobars every 0.5 x the incoming wave
  } else {
    v = 20.0 * log(max(length(a), 1e-4)) / log(10.0);
    col = texture2D(lutSeq, vec2(clamp((v + 20.0) / 40.0, 0.0, 1.0), 0.5)).rgb;
    stepv = 3.0;                                          // level contours every 3 dB
  }
  if (stepv > 0.0 && lines > 0.5) {
    float f = v / stepv; float d = abs(fract(f - 0.5) - 0.5); float w = fwidth(f);
    col = mix(col, vec3(0.07, 0.09, 0.11), (1.0 - smoothstep(0.0, w * 1.1, d)) * 0.32);
  }
  gl_FragColor = vec4(col, opacity);
}`;
function slice() {
  const mat = new THREE.ShaderMaterial({ vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide, transparent: true,
    uniforms: { field: { value: null }, mask: { value: null }, lutDiv: { value: lutTex[0] }, lutSeq: { value: lutTex[1] },
      phase: { value: 0 }, mode: { value: 0 }, clipv: { value: CLIP }, opacity: { value: 0.96 }, lines: { value: 1 } } });
  const m = new THREE.Mesh(new THREE.BufferGeometry(), mat); m.renderOrder = 2; scene.add(m); return m;
}
const sliceH = slice(), sliceV = slice();

// 3D wavefronts: ray-march the field through a box and draw the surfaces where it equals ±iso,
// lit from their gradient. Rays STOP at tissue (the voxel mask), so the ear occludes the field behind it.
const VVS = `varying vec3 vOrigin; varying vec3 vDirection;
void main(){
  vOrigin = vec3(inverse(modelMatrix) * vec4(cameraPosition, 1.0));
  vDirection = position - vOrigin;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
}`;
const VFS = `precision highp float; precision highp sampler3D;
uniform sampler3D field; uniform sampler3D mask;
uniform float phase; uniform int mode; uniform float iso; uniform float alpha;
uniform vec3 dims; uniform vec3 boxMin; uniform vec3 boxSize;
uniform float cutOn; uniform vec4 cut; uniform vec3 posCol; uniform vec3 negCol; uniform float showNeg;
varying vec3 vOrigin; varying vec3 vDirection;
out highp vec4 outColor;
vec2 hitBox(vec3 o, vec3 d){ vec3 inv = 1.0 / d; vec3 t0 = (-0.5 - o) * inv; vec3 t1 = (0.5 - o) * inv;
  vec3 a = min(t0, t1); vec3 b = max(t0, t1); return vec2(max(max(a.x, a.y), a.z), min(min(b.x, b.y), b.z)); }
float val(vec3 uv){ vec2 a = texture(field, uv).rg;
  if (mode == 1) return 20.0 * log(max(length(a), 1e-4)) / log(10.0);
  return a.x * cos(phase) - a.y * sin(phase); }
vec3 grad(vec3 uv){ vec3 h = 1.0 / dims;
  return vec3(val(uv + vec3(h.x, 0, 0)) - val(uv - vec3(h.x, 0, 0)), val(uv + vec3(0, h.y, 0)) - val(uv - vec3(0, h.y, 0)),
              val(uv + vec3(0, 0, h.z)) - val(uv - vec3(0, 0, h.z))) / (2.0 * h * boxSize); }
void main(){
  vec3 d = normalize(vDirection);
  vec2 b = hitBox(vOrigin, d);
  if (b.x > b.y) discard;
  b.x = max(b.x, 0.0);
  float stepLen = 0.6 / max(dims.x, max(dims.y, dims.z));
  vec3 L = normalize(vec3(0.35, 0.85, 0.4)); vec3 V = normalize(-d * boxSize);
  vec4 acc = vec4(0.0); float prev = 0.0; bool has = false;
  for (int i = 0; i < 900; i++) {
    float t = b.x + float(i) * stepLen;
    if (t > b.y || acc.a > 0.97) break;
    vec3 uv = vOrigin + t * d + 0.5;
    vec3 wp = boxMin + uv * boxSize;
    if (cutOn > 0.5 && dot(cut.xyz, wp) + cut.w < 0.0) { has = false; continue; }
    if (texture(mask, uv).r > 0.5) break;
    float v = val(uv);
    if (has) for (int k = 0; k < 2; k++) {
      if (k == 1 && showNeg < 0.5) break;
      float lv = k == 0 ? iso : -iso;
      if ((prev - lv) * (v - lv) < 0.0) {
        vec3 n = normalize(grad(uv) + 1e-6);
        float diff = abs(dot(n, L)), rim = pow(1.0 - abs(dot(n, V)), 2.0);
        vec3 col = (k == 0 ? posCol : negCol) * (0.42 + 0.58 * diff) + 0.16 * rim;
        acc.rgb += (1.0 - acc.a) * alpha * col; acc.a += (1.0 - acc.a) * alpha;
      }
    }
    prev = v; has = true;
  }
  if (acc.a < 0.01) discard;
  outColor = vec4(acc.rgb / acc.a, acc.a);
}`;
const volMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, vertexShader: VVS, fragmentShader: VFS,
  side: THREE.BackSide, transparent: true, depthTest: false, depthWrite: false,
  uniforms: { field: { value: null }, mask: { value: null }, phase: { value: 0 }, mode: { value: 0 }, iso: { value: .5 }, alpha: { value: .42 },
    dims: { value: new THREE.Vector3() }, boxMin: { value: new THREE.Vector3() }, boxSize: { value: new THREE.Vector3() },
    cutOn: { value: 0 }, cut: { value: new THREE.Vector4() }, showNeg: { value: 0 }, posCol: { value: new THREE.Color() }, negCol: { value: new THREE.Color() } } });
const volume = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), volMat); volume.renderOrder = 10; scene.add(volume);
const COLS3 = { pressure: ['#c8413a', '#3b7fbf'], level: ['#e66101', '#5e3c99'] };   // RdBu ends; PuOr ends for level
function tex3(data, X, Y, Z, rg) {
  const t = new THREE.Data3DTexture(data, X, Y, Z);
  t.format = rg ? THREE.RGFormat : THREE.RedFormat; t.type = rg ? THREE.HalfFloatType : THREE.UnsignedByteType;
  t.minFilter = t.magFilter = THREE.LinearFilter; t.unpackAlignment = 1; t.needsUpdate = true; return t;
}
// atlas pixel of voxel (x, y, z) in frame f: tile n = f·Z + z, row-major tiles, tile rows = y, tile columns = x
function voxels(im, dims, cols, f, fn) {
  const [X, Y, Z] = dims;
  for (let z = 0; z < Z; z++) {
    const n = f * Z + z, r = Math.floor(n / cols), c = n % cols;
    for (let y = 0; y < Y; y++) {
      const row = ((r * Y + y) * im.w + c * X) * 4, o = (z * Y + y) * X;
      for (let x = 0; x < X; x++) fn(o + x, row + x * 4);
    }
  }
}
function place(m, corners) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(corners.flat(), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 1, 0, 0, 1, 1, 1], 2));
  g.setIndex([0, 1, 2, 2, 1, 3]); m.geometry.dispose(); m.geometry = g;
}

const head = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshStandardMaterial({ color: 0xd9d5ce, transparent: true, opacity: .45, side: THREE.DoubleSide, depthWrite: false }));
head.rotation.y = Math.PI / 2; scene.add(head);

const spk = new THREE.Group();
spk.add(new THREE.Mesh(new THREE.BoxGeometry(16, 16, 12), new THREE.MeshStandardMaterial({ color: 0x3a3f46, roughness: .6 })));
const cone = new THREE.Mesh(new THREE.CylinderGeometry(6.5, 3, 3, 40, 1, true), new THREE.MeshStandardMaterial({ color: 0x9aa0a8, side: THREE.DoubleSide }));

// ---------- colour bar ----------
function colorbar() {

    const lvl = state.mode === 1, v = +$('iso').value, [pc, nc] = lvl ? COLS3.level : COLS3.pressure;
    const items = lvl ? [[pc, `+${v.toFixed(1)} dB  louder`], [nc, `−${v.toFixed(1)} dB  quieter`]]
                      : [[pc, `+${v.toFixed(2)}  compression`], [nc, `−${v.toFixed(2)}  rarefaction`]];
    g.font = '500 22px Inter, system-ui, sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'left';
    if (!$('tN').checked) items.length = 1;
    items.forEach(([col, txt], i) => { const x = pad + i * (W / 2); g.fillStyle = col; g.fillRect(x, 14, 30, 30); g.fillStyle = '#1c2127'; g.fillText(txt, x + 40, 30); });
    $('cbarLabel').textContent = lvl ? 'Surfaces of equal sound level, re incoming wave' : 'Surfaces of equal pressure, ÷ incoming wave';
    return;
  }

  for (let x = 0; x < im.width; x++) { const col = sample(k, x / (im.width - 1)); for (let y = 0; y < bh; y++) im.data.set([col[0] * 255, col[1] * 255, col[2] * 255, 255], (y * im.width + x) * 4); }
  g.putImageData(im, pad, 4); g.strokeStyle = '#5d646e'; g.lineWidth = 1; g.strokeRect(pad + .5, 4.5, W - 2 * pad - 1, bh - 1);
  // end triangles: values beyond the range are drawn in the end colours
  for (const [x0, dx, t] of [[pad, -1, 0], [W - pad, 1, 1]]) {
    const col = sample(k, t); g.fillStyle = `rgb(${col.map((u) => u * 255).join(',')})`;
    g.beginPath(); g.moveTo(x0, 4); g.lineTo(x0 + dx * 11, 4 + bh / 2); g.lineTo(x0, 4 + bh); g.closePath(); g.fill(); g.stroke();
  }

}

  const t = r.transfer, W = 320, H = 180, L = 36, Rr = 10, T = 12, B = 30;
  const fx = (f) => L + (Math.log10(f) - 2) / (Math.log10(12000) - 2) * (W - L - Rr);
  const lo = -10, hi = 25, fy = (d) => T + (hi - Math.max(lo, Math.min(hi, d))) / (hi - lo) * (H - T - B);
  const path = (k) => t.freqs_hz.map((f, i) => `${i ? 'L' : 'M'}${fx(f).toFixed(1)},${fy(t[k][i]).toFixed(1)}`).join('');
  let g = '';
  for (const d of [-10, 0, 10, 20]) g += `<line x1="${L}" x2="${W - Rr}" y1="${fy(d)}" y2="${fy(d)}" stroke="#e6e3de"/><text x="${L - 6}" y="${fy(d) + 4}" fill="#5d646e" font-size="10" text-anchor="end">${d}</text>`;
  for (const [f, s] of [[100, '100'], [1000, '1k'], [10000, '10k']]) g += `<text x="${fx(f)}" y="${H - 14}" fill="#5d646e" font-size="10" text-anchor="middle">${s}</text>`;
  for (const x of r.files.tones) g += `<line x1="${fx(x.hz)}" x2="${fx(x.hz)}" y1="${T}" y2="${H - B}" stroke="#2f5fd0" stroke-dasharray="3 3" opacity=".6"/>`;
  $('chart').innerHTML = `${g}<text x="${L}" y="${H - 2}" fill="#5d646e" font-size="10">Frequency (Hz)</text><text x="4" y="${T + 2}" fill="#5d646e" font-size="10">dB</text>
    <path d="${path('entrance_db')}" fill="none" stroke="#8a9099" stroke-width="1.4"/>
    <path d="${path('eardrum_db')}" fill="none" stroke="#1c2127" stroke-width="2"/>
    <text x="${W - Rr}" y="${T + 10}" fill="#1c2127" font-size="10" text-anchor="end">eardrum</text>
    <text x="${W - Rr}" y="${T + 24}" fill="#8a9099" font-size="10" text-anchor="end">canal entrance</text>`;
}
function playClip(btn, src) {
  const a = $('player');
  if (btn.classList.contains('on')) { a.pause(); btn.classList.remove('on'); return; }
  $('aEar').classList.remove('on'); $('aFree').classList.remove('on');
  a.src = src; a.play().then(() => btn.classList.add('on')).catch(() => {});
  a.onended = () => btn.classList.remove('on');
}
$('aFree').addEventListener('click', () => playClip($('aFree'), 'free.wav'));
$('aEar').addEventListener('click', () => playClip($('aEar'), state.run.audio));
$('assume').innerHTML = `<ul>${ear.assumptions.map((s) => `<li>${s}</li>`).join('')}<li>Ear processed as a ${ear.side} ear.</li></ul>`;

// ---------- camera presets ----------
const box = new THREE.Box3().setFromObject(earMesh);
runs.forEach((r) => box.expandByPoint(new THREE.Vector3(...r.speaker_mm)));
const ctr = box.getCenter(new THREE.Vector3()), rad = box.getSize(new THREE.Vector3()).length();
const front = new THREE.Vector3(...ear.front);
let cutMode = 'none', currentView = '3d';
function setCut(on) {
  $('tX').checked = on;
  const P = state.run.planes;
  if (cutMode === 'front') cutPlane.set(front.clone().negate(), front.z * P.v.z);   // keep the ear behind the vertical slice
  else cutPlane.set(new THREE.Vector3(0, -1, 0), P.h.y + 0.5);                     // keep the ear below the horizontal slice
  earMat.clippingPlanes = edgeMat.clippingPlanes = on ? [cutPlane] : [];
  volMat.uniforms.cutOn.value = on ? 1 : 0; volMat.uniforms.cut.value.set(cutPlane.normal.x, cutPlane.normal.y, cutPlane.normal.z, cutPlane.constant);
  earMat.needsUpdate = edgeMat.needsUpdate = true;
}
$('tX').addEventListener('change', (e) => setCut(e.target.checked));
function fit(w, h) {             // camera distance that fits a w (across) × h (up) mm rectangle
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(h / 2 / t, w / 2 / (t * camera.aspect)) * 1.08;
}
function view(v) {
  currentView = v;
  const target = ctr.clone(), P = state.run.planes;
  if (v === 'top') {
    target.set((P.h.x[0] + P.h.x[1]) / 2, P.h.y, (P.h.z[0] + P.h.z[1]) / 2);
    camera.position.copy(target).add(new THREE.Vector3(0, fit(P.h.x[1] - P.h.x[0], P.h.z[1] - P.h.z[0]), 0)).addScaledVector(front, -.5);
    cutMode = 'top';
  } else if (v === 'front') {
    target.set((P.v.x[0] + P.v.x[1]) / 2, (P.v.y[0] + P.v.y[1]) / 2, P.v.z);
    camera.position.copy(target).addScaledVector(front, fit(P.v.x[1] - P.v.x[0], P.v.y[1] - P.v.y[0]));
    cutMode = 'front'; if (!$('tV').checked) { $('tV').checked = true; sliceV.visible = true; }
  }
  else { camera.position.copy(ctr).add(new THREE.Vector3(rad * .85, rad * .75, 0)).addScaledVector(front, rad * .7); cutMode = 'top'; }
  setCut(v !== '3d');
  controls.target.copy(target); camera.lookAt(target); controls.update();
}
document.querySelector('.views').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) view(b.dataset.view); });

await choose(state.run, '4000');
view('3d');

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) { state.playing = false; $('play').textContent = '▶'; }
let last = 0;
renderer.setAnimationLoop((now) => {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.round(w * renderer.getPixelRatio())) { renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix(); }
  if (state.playing && state.data) {
    const dt = last ? now - last : 0;
    if (state.sound === 'pulse') { if (now - (state.tick || 0) > 70) { state.tick = now; state.frame = (state.frame + 1) % nFrames(); draw(); } }
    else if (state.mode === 0) { state.phase = (state.phase + dt / 1800 * 2 * Math.PI) % (2 * Math.PI); draw(); }
  }
  last = now;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
